services:
  site:
    # Version publiée ; pour construire depuis les sources, remplace par `build: .`
    image: ghcr.io/fmplaw/innkeeper:0.15.0
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - data:/data
      # Copies quotidiennes de la base (voir « Exploitation » dans le README).
      - backups:/backups
    restart: unless-stopped

volumes:
  data:
  backups:
