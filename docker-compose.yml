services:
  site:
    # Version publiée ; pour construire depuis les sources, remplace par `build: .`
    image: ghcr.io/fmplaw/innkeeper:0.17.1
    env_file: .env
    ports:
      # Joignable seulement depuis cette machine, par le reverse proxy HTTPS : Docker passe
      # outre le pare-feu de l'hôte, et "3000:3000" ouvrirait le site en HTTP clair à tout le réseau.
      # Proxy sur une autre machine : remplace par "3000:3000" et filtre le port 3000.
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
