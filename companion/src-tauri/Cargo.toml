[package]
name = "innkeeper-sync"
version = "0.0.0"
description = "InnkeeperSync : synchronisation de l'addon avec le site de la guilde"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

# Versions figées : publiées depuis au moins deux semaines au moment du choix.
[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-http = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-updater = "=2.14.0"
# Utilisé par le code que génère tauri::generate_context! (configuration des modules).
serde_json = "1"

# Exécutable le plus petit possible.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
